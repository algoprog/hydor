# The desktop apps, built on GitHub's own computers and published on the repository's Releases page when a version tag
# (v1.2.3) is pushed:
#   macOS    Apple silicon and Intel: Hydor-<version>-<arch>-mac.dmg, and .zip for the app's updater
#   Windows  x64: Hydor-<version>-x64-win.exe, an installer for your own account, which the updater runs too
#   Linux    x64 and ARM: Hydor-<version>-<arch>.AppImage and .deb
# Each release also carries the update feeds the apps read (hydor-mac.json, hydor-windows.json, hydor-linux.json) and
# copies of the downloads under names without the version, for the README's links (releases/latest/download/…).
# Run it by hand (Actions → Desktop apps → Run workflow) to build without publishing: the builds are kept as the run's
# artifacts. Every build is checked before it is kept: its server starts from inside it, and the app itself opens and
# starts its server (on Windows, also once installed with its installer).
#
# The Mac app is signed with Hydor's own self-signed certificate (desktop/scripts/sign.cjs), the same for every version,
# so that macOS keeps the permissions people give it (Accessibility, Screen Recording) when it updates. Repository
# secrets: MAC_SELF_SIGNED_CERTIFICATE (the .p12, base64-encoded) and MAC_SELF_SIGNED_CERTIFICATE_PASSWORD; without
# them it is signed ad hoc, and every update needs those permissions again. It is not notarized: people right-click →
# Open it the first time.
# Signing and notarizing it with a Developer ID instead (optional). Repository secrets:
#   MAC_CERTIFICATE           a Developer ID Application certificate with its key, as a .p12, base64-encoded
#   MAC_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_ID                  the Apple Account of your developer membership
#   APPLE_APP_SPECIFIC_PASSWORD  an app-specific password for it (account.apple.com → Sign-In and Security)
#   APPLE_TEAM_ID             your team's ID (developer.apple.com → Membership)
# The Windows installer is not signed: Windows SmartScreen asks people to confirm it the first time.
name: Desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22.23.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # Apple silicon
            name: mac-arm64
            unpacked: desktop/dist/mac-arm64/Hydor.app
            program: desktop/dist/mac-arm64/Hydor.app/Contents/MacOS/Hydor
          - runner: macos-15-intel
            name: mac-x64
            unpacked: desktop/dist/mac/Hydor.app
            program: desktop/dist/mac/Hydor.app/Contents/MacOS/Hydor
          # Windows Server 2022's Visual Studio is one node-gyp knows (a native module checks for its prebuilt build).
          - runner: windows-2022
            name: windows-x64
            unpacked: desktop/dist/win-unpacked
            program: desktop/dist/win-unpacked/Hydor.exe
          # Ubuntu 22.04: the Linux builds need its C library (2.34) or newer.
          - runner: ubuntu-22.04
            name: linux-x64
            unpacked: desktop/dist/linux-unpacked
            program: desktop/dist/linux-unpacked/hydor
          - runner: ubuntu-22.04-arm
            name: linux-arm64
            unpacked: desktop/dist/linux-arm64-unpacked
            program: desktop/dist/linux-arm64-unpacked/hydor
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Linux's build tools (tmux's terminal library, a screen for opening the app, tmux for the server's test, and X11's XTest and a compositor for computer use's)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libncurses-dev bison xvfb tmux libxtst6 xcompmgr
      - name: Build the app
        run: npm ci --no-audit --no-fund && npm run build
      - name: The server on this system (agents, terminals, commands)
        run: OUTDIR=dist/dev node scripts/build-server.mjs server/platform-test.ts && DATA_DIR="$RUNNER_TEMP/hydor-test-platform" node dist/dev/platform-test.js
      - name: Gather the server, Node.js and tmux
        run: desktop/scripts/stage.sh
      - name: Pack (the Mac app signed with Hydor's certificate, or with a Developer ID and notarized when those secrets are there)
        working-directory: desktop
        env:
          MAC_SELF_SIGNED_CERTIFICATE: ${{ secrets.MAC_SELF_SIGNED_CERTIFICATE }}
          MAC_SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SELF_SIGNED_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          npm ci --no-audit --no-fund
          scripts/dist.sh
      - name: The app's server starts from inside it
        run: node desktop/scripts/smoke.mjs "${{ matrix.unpacked }}"
      - name: The app opens and starts its server
        run: node desktop/scripts/launch-test.mjs "${{ matrix.program }}"
      # Computer use on the system itself: the mouse, the keyboard, typing in any script and opening apps (on Windows
      # with the helper this build ships, then with PowerShell compiling it), and the glow over the screen staying out
      # of the agent's screenshots. Windows' and macOS's runners decide what a program may see and press there, so their
      # results are reported without holding a release back.
      - name: Computer use on this system
        continue-on-error: ${{ runner.os != 'Linux' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            OUTDIR=dist/dev node scripts/build-server.mjs server/computer/x11-test.ts
            HYDOR_TEST_XVFB=1 DATA_DIR=/tmp/hydor-test-x11 node dist/dev/x11-test.js
          elif [ "$RUNNER_OS" = Windows ]; then
            OUTDIR=dist/dev node scripts/build-server.mjs server/computer/windows-test.ts
            HYDOR_COMPUTER_HELPER="$(cygpath -w "$PWD/desktop/build/bin/hydor-computer.exe")" node dist/dev/windows-test.js
            node dist/dev/windows-test.js
          else
            echo "macOS: the agent's driver is checked in server/computer/computer-test.ts; the glow below."
          fi
      - name: The glow stays out of the agent's screenshots
        continue-on-error: ${{ runner.os != 'Linux' }}
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            Xvfb :91 -screen 0 1920x1080x24 +extension RANDR +extension Composite -nolisten tcp & sleep 1
            DISPLAY=:91 xcompmgr -n & sleep 1
            DISPLAY=:91 npx electron --no-sandbox scripts/glow-test.cjs
          elif [ "$RUNNER_OS" = Windows ]; then
            HYDOR_COMPUTER_HELPER="$(cygpath -w "$PWD/build/bin/hydor-computer.exe")" npx electron scripts/glow-test.cjs
          else
            npx electron scripts/glow-test.cjs
          fi
      - name: The AppImage opens and starts its server, from its own copy
        if: runner.os == 'Linux'
        run: node desktop/scripts/launch-test.mjs desktop/dist/Hydor-*.AppImage
      - name: Installed with its installer, the app opens and starts its server; then it uninstalls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/Hydor-*-win.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Hydor'
          Get-ChildItem $installed | Select-Object -First 12 | Format-Table Name, Length
          node desktop/scripts/launch-test.mjs (Join-Path $installed 'Hydor.exe')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The uninstaller hands over to a copy of itself, so its end is the app's file going.
          Start-Process -FilePath (Join-Path $installed 'Uninstall Hydor.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $installed 'Hydor.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $installed 'Hydor.exe')) { Write-Error 'The uninstaller left the app'; exit 1 }
          Write-Output 'Uninstalled.'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*-win.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: The update feeds
        run: |
          for system in mac windows linux; do
            node desktop/scripts/feed.mjs "${GITHUB_REF_NAME#v}" out "$system" > "out/hydor-$system.json"
            cat "out/hydor-$system.json"
          done
      # The downloads again under names without the version, so the README's buttons can link to
      # releases/latest/download/Hydor-arm64-mac.dmg (and the others) and always get the newest.
      - name: Download links that stay the same
        run: |
          cd out
          for arch in arm64 x64; do cp Hydor-*-$arch-mac.dmg Hydor-$arch-mac.dmg; done
          cp Hydor-*-x64-win.exe Hydor-x64-win.exe
          cp Hydor-*-x86_64.AppImage Hydor-x64-linux.AppImage
          cp Hydor-*-arm64.AppImage Hydor-arm64-linux.AppImage
          cp Hydor-*-amd64.deb Hydor-x64-linux.deb
          cp Hydor-*-arm64.deb Hydor-arm64-linux.deb
          ls -l
      - name: Release notes from CHANGELOG.md
        run: awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > notes.md && cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.zip out/*.dmg out/*.exe out/*.AppImage out/*.deb out/hydor-*.json --title "Hydor ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
