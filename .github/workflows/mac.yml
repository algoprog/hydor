# The Mac app: built for Apple silicon and Intel on GitHub's Macs, and published on the repository's Releases
# page when a version tag (v1.2.3) is pushed. Each release carries naget-mac.json, which the app's updater reads.
# Run it by hand (Actions → Mac app → Run workflow) to build without publishing: the builds are kept as the
# run's artifacts.
#
# Signing and notarizing (optional; without them the app is signed ad hoc, and people right-click → Open it the
# first time). Repository secrets:
#   MAC_CERTIFICATE           a Developer ID Application certificate with its key, as a .p12, base64-encoded
#   MAC_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_ID                  the Apple Account of your developer membership
#   APPLE_APP_SPECIFIC_PASSWORD  an app-specific password for it (account.apple.com → Sign-In and Security)
#   APPLE_TEAM_ID             your team's ID (developer.apple.com → Membership)
name: Mac app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22.23.4

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15 # Apple silicon
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build the app
        run: npm ci --no-audit --no-fund && npm run build
      - name: Gather the server, Node.js and tmux
        run: mac/scripts/stage.sh
      - name: Pack (signed and notarized when the secrets are there)
        working-directory: mac
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          npm ci --no-audit --no-fund
          scripts/dist.sh
      - name: The app starts its server
        run: mac/scripts/smoke.sh mac/dist/mac*/"Naget Agent.app"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            mac/dist/*.zip
            mac/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: The update feed
        run: node mac/scripts/feed.mjs "${GITHUB_REF_NAME#v}" out > out/naget-mac.json && cat out/naget-mac.json
      - name: Release notes from CHANGELOG.md
        run: awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > notes.md && cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.zip out/*.dmg out/naget-mac.json --title "Naget Agent ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
