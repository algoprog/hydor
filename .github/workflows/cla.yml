# The contributor agreement (CLA.md): asks each new contributor on a pull request to sign it once, with a comment,
# and keeps the signatures on the cla-signatures branch. The maintainer and bots don't sign.
name: Contributor agreement

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Hydor CLA and I agree to it.'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/algoprog/hydor/blob/main/CLA.md
          branch: cla-signatures
          allowlist: algoprog,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Hydor CLA and I agree to it.
          custom-notsigned-prcomment: Thank you for your pull request! Before it can be merged, please read the [contributor agreement](https://github.com/algoprog/hydor/blob/main/CLA.md) and sign it by commenting on this pull request with the sentence below. You only sign once, and it covers all your contributions.
          custom-allsigned-prcomment: Everyone here has signed the contributor agreement. Thank you!
          lock-pullrequest-aftermerge: false
