<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
<title id="t">Memory's three parts</title>
<desc id="d">Memory notes, wiki memory and documents: who writes each one and what reaches the agent. The helper model reads documents, conversations and commits and writes to notes and the wiki. The agent gets notes without asking, a few wiki lines at the start, and documents only when it searches.</desc>
<defs><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#19202e"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#556075"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#13805a"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#a86a0b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#6d44e0"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#c4402f"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#c9d1df"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="40" y="40" font-size="20" font-weight="700" fill="#19202e" text-anchor="start">Memory's three parts</text>
<rect x="40" y="62" width="880" height="42" rx="12" fill="#e8ecf4" stroke="#a86a0b" stroke-width="1.5"/>
<text x="480" y="88" font-size="13.5" font-weight="400" fill="#19202e" text-anchor="middle">The helper model reads new documents, finished conversations and commits, and keeps what lasts</text>
<rect x="40" y="150" width="280" height="288" rx="12" fill="#f3f5f9" stroke="#2563eb" stroke-width="2"/>
<text x="58" y="182" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">Memory notes</text>
<text x="58" y="202" font-size="12" font-weight="400" fill="#556075" text-anchor="start">Short facts in the app’s database</text>
<text x="58" y="233" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">WRITTEN BY</text>
<text x="58" y="251" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">Agents as they work, you in Settings,</text>
<text x="58" y="269" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">and the helper when it tidies up</text>
<text x="58" y="293" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">HOLDS</text>
<text x="58" y="311" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">About you, about a project, about one</text>
<text x="58" y="329" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">session: a sentence or two each</text>
<text x="58" y="353" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">THE AGENT GETS</text>
<text x="58" y="371" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">Your profile, an index of what is kept,</text>
<text x="58" y="389" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">and the notes that stand out, without</text>
<text x="58" y="407" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">asking</text>
<rect x="340" y="150" width="280" height="288" rx="12" fill="#f3f5f9" stroke="#6d44e0" stroke-width="2"/>
<text x="358" y="182" font-size="18" font-weight="700" fill="#6d44e0" text-anchor="start">Wiki memory</text>
<text x="358" y="202" font-size="12" font-weight="400" fill="#556075" text-anchor="start">Linked articles with their sources, in plain files</text>
<text x="358" y="233" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">WRITTEN BY</text>
<text x="358" y="251" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">The helper, from documents,</text>
<text x="358" y="269" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">conversations and commits; agents with</text>
<text x="358" y="287" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">their wiki tools</text>
<text x="358" y="311" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">HOLDS</text>
<text x="358" y="329" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">How things work, decisions and why,</text>
<text x="358" y="347" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">pitfalls, plans: a wiki for each project</text>
<text x="358" y="365" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">and a shared one</text>
<text x="358" y="389" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">THE AGENT GETS</text>
<text x="358" y="407" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">A few article lines at the start; it opens</text>
<text x="358" y="425" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">an article when it needs the detail</text>
<rect x="640" y="150" width="280" height="288" rx="12" fill="#f3f5f9" stroke="#13805a" stroke-width="2"/>
<text x="658" y="182" font-size="18" font-weight="700" fill="#13805a" text-anchor="start">Documents</text>
<text x="658" y="202" font-size="12" font-weight="400" fill="#556075" text-anchor="start">The files themselves, indexed for search</text>
<text x="658" y="233" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">ADDED BY</text>
<text x="658" y="251" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">You, to a project’s own knowledge or to</text>
<text x="658" y="269" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">the shared knowledge</text>
<text x="658" y="293" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">HOLDS</text>
<text x="658" y="311" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">Papers, manuals, spreadsheets, notes:</text>
<text x="658" y="329" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">whatever you give a project</text>
<text x="658" y="353" font-size="10.5" font-weight="700" fill="#556075" text-anchor="start">THE AGENT GETS</text>
<text x="658" y="371" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">Nothing unasked: it searches them,</text>
<text x="658" y="389" font-size="13" font-weight="400" fill="#19202e" text-anchor="start">reads them and cites them</text>
<path d="M180 104 L180 150" fill="none" stroke="#a86a0b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-amber)"/>
<path d="M480 104 L480 150" fill="none" stroke="#a86a0b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-amber)"/>
<path d="M780 150 L780 104" fill="none" stroke="#13805a" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-green)"/>
<rect x="40" y="500" width="880" height="44" rx="12" fill="#e8ecf4" stroke="#2563eb" stroke-width="1.5"/>
<text x="480" y="527" font-size="14.5" font-weight="700" fill="#19202e" text-anchor="middle">An agent working in a session</text>
<path d="M180 438 L180 500" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-accent)"/>
<text x="192" y="474" font-size="12" font-weight="400" fill="#556075" text-anchor="start">given to it</text>
<path d="M480 438 L480 500" fill="none" stroke="#6d44e0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-violet)"/>
<text x="492" y="474" font-size="12" font-weight="400" fill="#556075" text-anchor="start">a few lines, then it reads</text>
<path d="M780 438 L780 500" fill="none" stroke="#13805a" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-green)"/>
<text x="792" y="474" font-size="12" font-weight="400" fill="#556075" text-anchor="start">when it asks</text>
</svg>
