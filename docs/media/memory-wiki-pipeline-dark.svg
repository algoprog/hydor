<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
<title id="t">How the wiki is written</title>
<desc id="d">Documents, conversations, commit messages and notes from memory are the sources. The helper plans which articles to update, then writes: update, revise or split. The wiki keeps a snapshot, the index and log, and front matter. A daily drift check marks articles stale when the files they name change, and revises a few.</desc>
<defs><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#e9edf4"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#9ba7ba"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#5b9dff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#4fc995"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#e8a93d"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#a78bfa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#f0786a"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#313b4c"/></marker></defs>
<rect width="960" height="548" fill="#0f1319"/>
<text x="40" y="40" font-size="20" font-weight="700" fill="#e9edf4" text-anchor="start">How the wiki is written</text>
<text x="30" y="72" font-size="11" font-weight="700" fill="#9ba7ba" text-anchor="start">SOURCES</text>
<text x="260" y="72" font-size="11" font-weight="700" fill="#9ba7ba" text-anchor="start">PLAN</text>
<text x="490" y="72" font-size="11" font-weight="700" fill="#9ba7ba" text-anchor="start">WRITE</text>
<text x="740" y="72" font-size="11" font-weight="700" fill="#9ba7ba" text-anchor="start">KEEP</text>
<rect x="30" y="84" width="196" height="74" rx="12" fill="#171c25" stroke="#4fc995" stroke-width="2"/>
<text x="44" y="109" font-size="14.5" font-weight="700" fill="#4fc995" text-anchor="start">Documents</text>
<text x="44" y="128" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">New and changed files, a few</text>
<text x="44" y="143" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">dozen an hour</text>
<rect x="30" y="168" width="196" height="74" rx="12" fill="#171c25" stroke="#5b9dff" stroke-width="2"/>
<text x="44" y="193" font-size="14.5" font-weight="700" fill="#5b9dff" text-anchor="start">Conversations</text>
<text x="44" y="212" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">Picked by signal; read once a</text>
<text x="44" y="227" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">session goes quiet</text>
<rect x="30" y="252" width="196" height="74" rx="12" fill="#171c25" stroke="#e8a93d" stroke-width="2"/>
<text x="44" y="277" font-size="14.5" font-weight="700" fill="#e8a93d" text-anchor="start">Commit messages</text>
<text x="44" y="296" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">Once a day, up to 60 commits</text>
<rect x="30" y="336" width="196" height="74" rx="12" fill="#171c25" stroke="#a78bfa" stroke-width="2"/>
<text x="44" y="361" font-size="14.5" font-weight="700" fill="#a78bfa" text-anchor="start">Notes from memory</text>
<text x="44" y="380" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">Long design history, from the</text>
<text x="44" y="395" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">tidy-up</text>
<rect x="260" y="84" width="196" height="328" rx="12" fill="#171c25" stroke="#313b4c" stroke-width="1.5"/>
<text x="274" y="112" font-size="16" font-weight="700" fill="#e9edf4" text-anchor="start">Plan</text>
<text x="274" y="136.5" font-size="12.5" font-weight="400" fill="#e9edf4" text-anchor="start">The helper reads the source</text>
<text x="274" y="153.5" font-size="12.5" font-weight="400" fill="#e9edf4" text-anchor="start">with the best 20 articles,</text>
<text x="274" y="170.5" font-size="12.5" font-weight="400" fill="#e9edf4" text-anchor="start">picked by their title words</text>
<text x="274" y="187.5" font-size="12.5" font-weight="400" fill="#e9edf4" text-anchor="start">and by their meaning.</text>
<text x="274" y="218.5" font-size="12.5" font-weight="400" fill="#e9edf4" text-anchor="start">It chooses up to 3 articles to</text>
<text x="274" y="235.5" font-size="12.5" font-weight="400" fill="#e9edf4" text-anchor="start">update, up to 2 new ones,</text>
<text x="274" y="252.5" font-size="12.5" font-weight="400" fill="#e9edf4" text-anchor="start">and for a document up to 3</text>
<text x="274" y="269.5" font-size="12.5" font-weight="400" fill="#e9edf4" text-anchor="start">short notes.</text>
<rect x="490" y="84" width="212" height="328" rx="12" fill="#171c25" stroke="#313b4c" stroke-width="1.5"/>
<text x="504" y="112" font-size="16" font-weight="700" fill="#e9edf4" text-anchor="start">Write</text>
<rect x="502" y="126" width="188" height="84" rx="10" fill="#1e2531" stroke="#5b9dff" stroke-width="1.6"/>
<text x="514" y="147" font-size="13.5" font-weight="700" fill="#5b9dff" text-anchor="start">Update</text>
<text x="514" y="162.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">Adds what the source says to</text>
<text x="514" y="177" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">the article.</text>
<rect x="502" y="218" width="188" height="84" rx="10" fill="#1e2531" stroke="#e8a93d" stroke-width="1.6"/>
<text x="514" y="239" font-size="13.5" font-weight="700" fill="#e8a93d" text-anchor="start">Revise</text>
<text x="514" y="254.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">Replaces what the source</text>
<text x="514" y="269" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">contradicts, and lists each</text>
<text x="514" y="283.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">removed statement with a</text>
<text x="514" y="298" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">reason.</text>
<rect x="502" y="310" width="188" height="84" rx="10" fill="#1e2531" stroke="#a78bfa" stroke-width="1.6"/>
<text x="514" y="331" font-size="13.5" font-weight="700" fill="#a78bfa" text-anchor="start">Split</text>
<text x="514" y="346.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">An article over 12,000</text>
<text x="514" y="361" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">characters becomes a hub and</text>
<text x="514" y="375.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">2 to 5 parts first.</text>
<rect x="740" y="84" width="190" height="328" rx="12" fill="#171c25" stroke="#313b4c" stroke-width="1.5"/>
<text x="754" y="112" font-size="16" font-weight="700" fill="#e9edf4" text-anchor="start">Keep</text>
<rect x="752" y="126" width="166" height="62" rx="10" fill="#1e2531" stroke="none" stroke-width="1.5"/>
<text x="764" y="146" font-size="13" font-weight="700" fill="#e9edf4" text-anchor="start">A snapshot</text>
<text x="764" y="161.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">of the old text, in a hidden</text>
<text x="764" y="175.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">folder (the 20 newest)</text>
<rect x="752" y="195" width="166" height="62" rx="10" fill="#1e2531" stroke="none" stroke-width="1.5"/>
<text x="764" y="215" font-size="13" font-weight="700" fill="#e9edf4" text-anchor="start">index.md</text>
<text x="764" y="230.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">a line for each article,</text>
<text x="764" y="244.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">with its summary</text>
<rect x="752" y="264" width="166" height="62" rx="10" fill="#1e2531" stroke="none" stroke-width="1.5"/>
<text x="764" y="284" font-size="13" font-weight="700" fill="#e9edf4" text-anchor="start">log.md</text>
<text x="764" y="299.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">what changed, when, and</text>
<text x="764" y="313.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">from what</text>
<rect x="752" y="333" width="166" height="62" rx="10" fill="#1e2531" stroke="none" stroke-width="1.5"/>
<text x="764" y="353" font-size="13" font-weight="700" fill="#e9edf4" text-anchor="start">Front matter</text>
<text x="764" y="368.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">summary, files named,</text>
<text x="764" y="382.5" font-size="11.5" font-weight="400" fill="#e9edf4" text-anchor="start">commit</text>
<path d="M228 248 L258 248" fill="none" stroke="#9ba7ba" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<path d="M458 248 L488 248" fill="none" stroke="#9ba7ba" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<path d="M704 248 L738 248" fill="none" stroke="#9ba7ba" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<text x="30" y="466" font-size="12.5" font-weight="700" fill="#9ba7ba" text-anchor="start">Articles tied to the code</text>
<rect x="260" y="444" width="442" height="78" rx="12" fill="#171c25" stroke="#e8a93d" stroke-width="2"/>
<text x="274" y="468" font-size="14" font-weight="700" fill="#e8a93d" text-anchor="start">The drift check, once a day</text>
<text x="274" y="486" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">git shows which files changed since each article’s commit and marks it</text>
<text x="274" y="501" font-size="12" font-weight="400" fill="#e9edf4" text-anchor="start">stale, with no helper. Up to 5 stale articles a day are revised.</text>
<path d="M835 414 L835 483 L704 483" fill="none" stroke="#e8a93d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-amber)"/>
<path d="M595 444 L595 414" fill="none" stroke="#e8a93d" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#a-amber)"/>
<text x="607" y="432" font-size="11.5" font-weight="400" fill="#9ba7ba" text-anchor="start">revised under the same rules</text>
</svg>
