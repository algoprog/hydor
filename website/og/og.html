<!doctype html>
<!-- The picture shown where a link to hydor.app is shared (website/src/img/og.jpg, 1200×630). To make it again:
     node website/build.mjs --serve 4321, copy this file into dist/website, and screenshot
     http://localhost:4321/og.html at 1200×630 (website/README.md says how). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate;
        background: radial-gradient(60% 80% at 78% 30%, rgba(56,189,248,.28), transparent 60%), radial-gradient(50% 60% at 10% 100%, rgba(94,234,212,.16), transparent 70%), #000; }
  .og-copy { position: absolute; left: 72px; top: 76px; width: 560px; }
  .og-copy .wordmark { width: 230px; color: #e9edf5; }
  .og-copy .wm-fill { transform: translateY(8px); animation: none; }
  .og-copy h1 { margin: 44px 0 0; font-size: 70px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 680; }
  .og-copy p { margin: 26px 0 0; font-size: 23px; line-height: 1.45; color: #bcc4d3; }
  .og-site { position: absolute; left: 72px; bottom: 58px; font-size: 22px; font-weight: 600; color: #e9edf5; letter-spacing: -0.01em; }
  .og-site span { color: #5eead4; }
  .og-shot { position: absolute; left: 640px; top: 92px; width: 760px; transform: perspective(1400px) rotateY(-16deg) rotateX(6deg); transform-origin: left center; }
  .og-shot .window img { display: block; width: 100%; }
  .og-ph { position: absolute; left: 905px; top: 250px; width: 190px; padding: 6px; border-radius: 32px; }
  .og-ph img { display: block; width: 100%; border-radius: 27px; }
  .og .waves { height: 120px; }
  .og .wave { animation: none; }
</style>
</head>
<body>
<div class="og">
  <div class="og-copy">
    <svg class="wordmark" viewBox="-4 -1 530 102" fill="none" stroke-width="10" aria-hidden="true">
      <defs>
        <clipPath id="c"><rect x="-10" y="0" width="542" height="100" /></clipPath>
        <mask id="m" maskUnits="userSpaceOnUse" x="-10" y="-10" width="116" height="120"><path d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" stroke="#fff" stroke-width="10" /></mask>
        <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="-4" x2="0" y2="96"><stop offset="0" stop-color="#5eead4" /><stop offset=".55" stop-color="#38bdf8" /><stop offset="1" stop-color="#60a5fa" /></linearGradient>
      </defs>
      <g clip-path="url(#c)">
        <path d="M5 0V100M61 0V100M5 50H61" stroke="currentColor" />
        <path transform="translate(104 0)" d="M-1 -6L35 52L71 -6M35 52V100" stroke="currentColor" />
        <path transform="translate(212 0)" d="M5 0V100M5 5H30A39 45 0 0 1 30 95H5" stroke="currentColor" />
        <g transform="translate(324 0)">
          <g mask="url(#m)"><g class="wm-fill">
            <path d="M-72 18 q9 -5.5 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 V130 H-72 Z" fill="url(#g)" stroke="none" />
            <path d="M-72 18 q9 -5.5 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0" stroke="#fff" stroke-width="5" opacity=".85" />
          </g></g>
          <path d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" stroke="#38bdf8" opacity=".3" />
        </g>
        <path transform="translate(458 0)" d="M5 100V5H34A25 20 0 0 1 34 50H5M30 50L66 106" stroke="currentColor" />
      </g>
    </svg>
    <h1>Give your agents<br /><span class="water-text">a home</span></h1>
    <p>Claude Code, Codex or any model on your machine, with the plans and APIs you already pay for. One memory, one place.</p>
  </div>
  <div class="og-site">hydor<span>.app</span> · free and open source</div>
  <div class="og-shot"><figure class="window" style="margin:0"><div class="window-bar"><i></i><i></i><i></i><span>Hydor</span></div><img src="img/app-start.webp" alt="" /></figure></div>
  <figure class="phone og-ph" style="margin:0"><img src="img/app-phone.webp" alt="" /></figure>
  <div class="waves">
    <svg class="wave wave-1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 60 Q 180 20 360 60 T 720 60 T 1080 60 T 1440 60 V120 H0Z" /></svg>
    <svg class="wave wave-2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 70 Q 180 40 360 70 T 720 70 T 1080 70 T 1440 70 V120 H0Z" /></svg>
  </div>
</div>
</body>
</html>
