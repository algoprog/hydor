<figure class="fig" data-fig="goals-and-swarms-goal">

<div class="gs-safe"><svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14"><rect x="3" y="7" width="10" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Kept safe</span><code data-p="tests">tests/</code><code>fixtures/</code><code>scripts/check.sh</code></div>

</div>
