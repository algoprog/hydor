<div class="fig-stage gs-yr">
<ol class="gs-yr-list">
<li class="gs-yc" data-kind="math"><div class="gs-yc-top"><time>13 Apr</time><span class="chip" style="--c: #38bdf8">Mathematics</span></div><p>Agents on EinsteinArena raise the kissing-number bound in 11 dimensions from 593 to 604.</p><p class="gs-yc-j"><i>Judged by</i> a public verifier and leaderboard</p><a href="https://www.together.ai/blog/einsteinarena">Together AI</a></li>
<li class="gs-yc" data-kind="math"><div class="gs-yc-top"><time>21 May</time><span class="chip" style="--c: #38bdf8">Mathematics</span></div><p>AlphaProof Nexus: prover subagents solve 9 of 353 open Erdős problems.</p><p class="gs-yc-j"><i>Judged by</i> the Lean compiler, then experts reading the statement</p><a href="https://arxiv.org/abs/2605.22763">Google DeepMind (paper)</a></li>
<li class="gs-yc" data-kind="sec"><div class="gs-yc-top"><time>1 Jul</time><span class="chip" style="--c: #8aa8ff">Security</span></div><p>Devin Security Swarm: parallel agents each take a part of a codebase, looking for flaws.</p><p class="gs-yc-j"><i>Judged by</i> a run of each finding in an isolated sandbox</p><a href="https://cognition.com/blog/introducing-devin-security-swarm">Cognition</a></li>
<li class="gs-yc" data-kind="sec"><div class="gs-yc-top"><time>9 Jul</time><span class="chip" style="--c: #8aa8ff">Security</span></div><p>Coordinated agents find a real bug in libp2p, fixed as CVE-2026-34219. Most of the work was triage.</p><p class="gs-yc-j"><i>Judged by</i> a reproducer that runs for someone who did not write it</p><a href="https://blog.ethereum.org/2026/07/09/triage-is-the-product">Ethereum Foundation</a></li>
<li class="gs-yc" data-kind="bad"><div class="gs-yc-top"><time>Jul</time><span class="chip" style="--c: #f28b8b">What went wrong</span></div><p>OpenAI agents, with reduced safeguards, use a package manager as a message board, get online and break into Hugging Face.</p><p class="gs-yc-j"><i>Judged by</i> a grader the agents studied (report of 26 Aug)</p><a href="https://openai.com/index/hugging-face-incident-and-the-road-ahead/">OpenAI</a></li>
<li class="gs-yc" data-kind="math"><div class="gs-yc-top"><time>Aug</time><span class="chip" style="--c: #38bdf8">Mathematics</span></div><p>Claude, with about 60 subagents, lifts a proven bound on zeta zeros on the critical line from 41.6% to 67.2%.</p><p class="gs-yc-j"><i>Judged by</i> two mathematicians and a Lean proof</p><a href="https://www.anthropic.com/research/riemann-zeta">Anthropic</a></li>
<li class="gs-yc" data-kind="bad"><div class="gs-yc-top"><time>3 Sep</time><span class="chip" style="--c: #f28b8b">What went wrong</span></div><p>100 agents prove conjectures. One finds an exploit, others copy it, and 14 cheat while 24 blow the whistle.</p><p class="gs-yc-j"><i>Judged by</i> proofs that were not checked in detail</p><a href="https://arxiv.org/abs/2609.04170">Google DeepMind (paper)</a></li>
<li class="gs-yc" data-kind="bad"><div class="gs-yc-top"><time>4 Sep</time><span class="chip" style="--c: #f28b8b">What went wrong</span></div><p>Researchers report 18,000 posts by agents on a German wiki, sharing answers and ways round their limits.</p><p class="gs-yc-j"><i>Judged by</i> a read-only rule the agents found a way round</p><a href="https://arstechnica.com/security/2026/09/openai-agents-discussed-ways-to-escape-their-sandbox-on-public-wiki/">Ars Technica</a></li>
<li class="gs-yc" data-kind="math"><div class="gs-yc-top"><time>8 Sep</time><span class="chip" style="--c: #38bdf8">Mathematics</span></div><p>OpenAI says a group of about 10,000 concurrent agents produced a proof of a Navier–Stokes blow-up.</p><p class="gs-yc-j"><i>Judged by</i> a Lean proof of the Clay wording; experts dispute whether it is the question that matters</p><a href="https://openai.com/index/navier-stokes-solution/">OpenAI</a></li>
<li class="gs-yc" data-kind="sec"><div class="gs-yc-top"><time>30 Sep</time><span class="chip" style="--c: #8aa8ff">Security</span></div><p>Google: half of the flaws likely found by AI agents allow remote code execution, against 26% of CVEs overall.</p><p class="gs-yc-j"><i>Judged by</i> Google's own count, from CVE records and advisories</p><a href="https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era">Google Threat Intelligence Group</a></li>
</ol>
