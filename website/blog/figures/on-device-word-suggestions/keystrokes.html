<figure class="fig" data-fig="on-device-word-suggestions-keystrokes">
  <div class="fig-stage">
    <p class="sr-only">The card's worked example. A message takes 40 keys to type. Hydor shows three suggestions. Two are right and are taken with Tab: they add 6 and 9 letters, so they save 5 and 8 keys, 13 in all. The third is wrong and is ignored. Typing saved: 13 out of 40, or 32%. Of the 3 suggestions shown, 2 were right: 67%. With 30 moments where a suggestion could appear and 3 shown, it suggests 10% of the time.</p>
    <div class="k-head" aria-hidden="true"><b>A 40-key message</b><span data-say>One key at a time</span></div>
    <div class="k-grid" aria-hidden="true"></div>
    <div class="fig-legend" aria-hidden="true">
      <span><i style="--c: var(--fg-2)"></i>A key you press</span>
      <span><i style="--c: var(--w1)"></i>Tab, taking a suggestion</span>
      <span><i style="--c: var(--ok)"></i>A key saved</span>
      <span><i style="--c: var(--err)"></i>A wrong suggestion, ignored</span>
    </div>
    <div class="k-nums" aria-live="polite">
      <div><b data-pressed>0</b><span>keys pressed</span></div>
      <div><b data-saved>0</b><span>keys saved</span></div>
      <div><b data-pct>0%</b><span>typing saved</span></div>
    </div>
    <div class="fig-controls"><button class="fig-btn" type="button" data-replay>Replay</button></div>
  </div>
  <figcaption>The card's worked example. Taking a suggestion costs one Tab, so a suggestion that adds 6 letters saves 5 keys, and one that adds 9 saves 8: 13 of 40 keys, 32%. The wrong third suggestion costs nothing but a glance. Of the 3 shown, 2 were right (67%); with 30 moments where one could appear, it suggested at 10% of them.</figcaption>
</figure>
