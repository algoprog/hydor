<figure class="fig" data-fig="research-with-agents-conjecture">
<div class="fig-stage rw-conj">
<div class="rw-head"><span class="rw-eg">Explore a conjecture</span><span class="rw-claimstate" data-claim><i></i><em>Open so far</em></span></div>
<p class="rw-statement">n² + n + 41 is prime for every n ≥ 0</p>
<ol class="rw-cases" data-cases aria-label="The cases n = 0 to 40"></ol>
<p class="rw-line" data-line aria-live="polite"></p>
<div class="rw-seq">
<span class="rw-cap">And a sequence, looked up</span>
<p class="rw-terms" data-terms></p>
<div class="rw-found" data-found hidden></div>
</div>
</div>
<div class="fig-controls" role="group" aria-label="Work the cases">
<button class="fig-btn" type="button" data-act="play" aria-pressed="true">Pause</button>
<button class="fig-btn" type="button" data-act="replay">Replay</button>
<label class="rw-range"><span class="sr-only">Cases worked, n from 0 to 40</span><input type="range" min="0" max="40" value="0" data-range></label>

<figcaption>Computed in your browser as you watch, nothing recorded. The cases n = 0 … 40 are worked one by one, and n = 40 gives 1681 = 41 × 41: the claim is false. Forty cases in a row that agree prove nothing, and the agent says so. The second part is the other kind of look: the first terms of a sequence found in the OEIS. Seven terms match 37 entries, so a match is only a lead until more terms agree.</figcaption>
</figure>
