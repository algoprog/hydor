<figure class="fig" data-fig="how-hydor-remembers-stands-out">
<div class="fig-stage">
<div class="hr-so-ctl">
<div class="fig-controls" role="group" aria-label="The request">
<button type="button" class="fig-btn" data-req="0" aria-pressed="true">A short question</button>
<button type="button" class="fig-btn" data-req="1" aria-pressed="false">A long brief</button>
</div>
<div class="fig-controls" role="group" aria-label="How a note is picked">
<button type="button" class="fig-btn" data-mode="fixed" aria-pressed="true">A fixed cut at 0.30</button>
<button type="button" class="fig-btn" data-mode="z" aria-pressed="false">Stands out: z ≥ 2.3</button>
</div>
</div>
<div class="hr-so-chart" role="img" aria-label="A histogram of dots: how alike each of 88 example notes is to the request, from 0 to 0.8. For a short question the dots cluster around 0.20, for a long brief around 0.44."></div>
<div class="hr-so-key"><span><i style="--c: var(--w1)"></i>Bears on the request</span><span><i style="--c: #7d8799"></i>Does not</span><span class="hr-so-keyring"><i class="ring"></i>Best 5%, left out of the mean and spread</span></div>

</div>

<div class="stat"><b data-count-to="43" data-suffix="%">43%</b><span>of the helpful notes found, not 24%</span></div>

</div>
<p class="hr-so-evalnote">Bar 2.3 against the earlier 2.6, over 782 messages of 242 sessions, 42 judged by hand.</p>
