<figure class="fig" data-fig="how-hydor-remembers-codebook">
<div class="fig-stage">
<div class="hr-cb-top">

<button type="button" class="fig-btn" data-state="0" aria-pressed="true">Full precision</button>

<div><b>A request</b>stays in full precision</div>
<div><b>A table</b>made once per request</div>

<div><b>A score</b>each stored vector read once</div>
</div>
</div>
<figcaption>A few dozen of a note's 768 numbers. Press 4 bits each, or wait: they snap to the nearest of 16 levels and the note shrinks from 3,072 bytes to 384. The levels here are an illustration of the idea; the real ones are fitted for each dimension.</figcaption>
