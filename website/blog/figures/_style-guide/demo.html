<figure class="fig" data-fig="_style-guide-demo">
  <div class="fig-stage">
    <div class="sg-lane" role="img" aria-label="A marker moves along a line through four steps; the step it is on lights up.">
      <ol class="sg-steps">
        <li data-step="0"><b>1</b><span>Write</span></li>
        <li data-step="1"><b>2</b><span>Build</span></li>
        <li data-step="2"><b>3</b><span>Look</span></li>
        <li data-step="3"><b>4</b><span>Fix</span></li>
      </ol>
      <div class="sg-track"><i class="sg-dot"></i></div>
    </div>
    <p class="sg-readout" aria-live="polite" data-readout>Step 1: write the post.</p>
  </div>
  <div class="fig-controls" role="group" aria-label="Speed">
    <button class="fig-btn" type="button" data-speed="slow" aria-pressed="false">Slow</button>
    <button class="fig-btn" type="button" data-speed="normal" aria-pressed="true">Normal</button>
    <button class="fig-btn" type="button" data-speed="fast" aria-pressed="false">Fast</button>
  </div>
  <div class="fig-legend"><span><i style="--c: #5eead4"></i>Done</span><span><i style="--c: #38bdf8"></i>Now</span><span><i style="--c: rgba(255,255,255,.2)"></i>Next</span></div>
  <figcaption>An example, not data: the marker walks the four steps and starts again, and stops when the figure is off the screen.</figcaption>
</figure>
