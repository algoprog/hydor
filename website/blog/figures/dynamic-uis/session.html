<figure class="fig wide" data-fig="dynamic-uis-session">
  <div class="fig-stage dua">
    <div class="dua-shot">
      <img src="/img/blog/dynamic-uis/session.webp" width="1600" height="1000" loading="lazy" alt="A session fixing failing checkout tests, waiting for approval: the sidebar with its sessions, the session's header, the work as an outline of parts, the step under way, a card asking to run the tests, and the message box." />
      <span class="dua-box" data-box aria-hidden="true"></span>
      <button class="dua-dot" type="button" data-i="0" style="--x: 5%; --y: 23.03%; --w: 20.55%; --h: 6.53%" aria-label="1: The sidebar">1</button>
      <button class="dua-dot" type="button" data-i="1" style="--x: 27.81%; --y: 4.31%; --w: 6.88%; --h: 2.75%" aria-label="2: Status">2</button>
      <button class="dua-dot" type="button" data-i="2" style="--x: 89.06%; --y: 2.03%; --w: 6.09%; --h: 4%" aria-label="3: Details">3</button>
      <button class="dua-dot" type="button" data-i="3" style="--x: 31.87%; --y: 23.11%; --w: 62.5%; --h: 4.5%" aria-label="4: The turn in one line">4</button>
      <button class="dua-dot" type="button" data-i="4" style="--x: 32.5%; --y: 28.11%; --w: 61.88%; --h: 8%" aria-label="5: The work as an outline">5</button>
      <button class="dua-dot" type="button" data-i="5" style="--x: 32.5%; --y: 36.11%; --w: 61.88%; --h: 7.3%" aria-label="6: The step under way">6</button>
      <button class="dua-dot" type="button" data-i="6" style="--x: 31.87%; --y: 45.41%; --w: 62.5%; --h: 22.91%" aria-label="7: Approvals">7</button>
      <button class="dua-dot" type="button" data-i="7" style="--x: 31.87%; --y: 85.25%; --w: 62.5%; --h: 12.25%" aria-label="8: The message box">8</button>
    </div>
    <ol class="dua-notes">
      <li data-i="0"><button class="dua-note" type="button" aria-pressed="false"><b>The sidebar</b><span>Every session with its state. The ones that need you say so, without your opening them.</span></button></li>
      <li data-i="1"><button class="dua-note" type="button" aria-pressed="false"><b>Status</b><span>Working, Needs you, Ready, or how the work ended: Done, Stopped or Failed.</span></button></li>
      <li data-i="2"><button class="dua-note" type="button" aria-pressed="false"><b>Details</b><span>The lines added and removed so far. It opens every change as a diff, and the commands that ran.</span></button></li>
      <li data-i="3"><button class="dua-note" type="button" aria-pressed="false"><b>The turn in one line</b><span>How long the agent has worked and, once it finishes, what the turn cost. Click it to fold the work away.</span></button></li>
      <li data-i="4"><button class="dua-note" type="button" aria-pressed="false"><b>The work as an outline</b><span>Each note the agent writes starts a part. A finished part is one line: what it did, its steps, the lines it changed.</span></button></li>
      <li data-i="5"><button class="dua-note" type="button" aria-pressed="false"><b>The step under way</b><span>Named in plain words, “Run the whole test suite”, with the command itself in quieter type and a running clock.</span></button></li>
      <li data-i="6"><button class="dua-note" type="button" aria-pressed="false"><b>Approvals</b><span>Before a command runs, a card asks: Allow, Always allow, or Deny.</span></button></li>
      <li data-i="7"><button class="dua-note" type="button" aria-pressed="false"><b>The message box</b><span>It stays free while the agent works. A follow-up joins the running turn, or waits in a queue.</span></button></li>
    </ol>
  </div>
  <figcaption>A session waiting for you, part by part. Point at a number, or pick a line from the list.</figcaption>
</figure>
