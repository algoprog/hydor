<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />
    <title>Hydor</title>
    <script src="/theme-boot.js"></script>
    <!--
      While the page loads: the logo, HYDΩR, its Ω filling with water (the wordmark's tide, components/Logo.tsx), over the
      theme's page colour. The moment the app has something of its own to show, it is there under the logo, and the logo
      goes home: into the app's own wordmark where one is in sight, its water draining, as the colour around it clears
      (lib/boot.ts). The Mac app shows the same while its server starts (mac/main.cjs bootPage), so there the water is
      already in when this page opens (theme-boot.js marks the page boot-full).
    -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: var(--bg, #000); color: var(--fg, #e9edf5); }
      #boot svg { display: block; width: min(232px, 56vw); height: auto; overflow: visible; }
      #boot .boot-fill { transform: translateY(112px); animation: boot-fill 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards; }
      .boot-full #boot .boot-fill { transform: translateY(8px); animation: none; }
      #boot .boot-ebb { animation: boot-ebb 3.2s ease-in-out 1.7s infinite; }
      #boot .boot-bob { animation: boot-bob 2.6s ease-in-out infinite; }
      #boot .boot-swell { animation: boot-swell 1.5s linear infinite; }
      @keyframes boot-fill { to { transform: translateY(8px); } }
      @keyframes boot-ebb { 50% { transform: translateY(12px); } }
      @keyframes boot-bob { 50% { transform: translateY(4px); } }
      @keyframes boot-swell { to { transform: translateX(-36px); } }
      .boot-landing svg[data-landing] { visibility: hidden; }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-fill { transform: translateY(8px); animation: none; }
        #boot .boot-ebb, #boot .boot-bob, #boot .boot-swell { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-label="Hydor is loading">
      <svg viewBox="-4 -1 530 102" width="232" height="45" fill="none" stroke-width="10" aria-hidden="true">
        <defs>
          <clipPath id="boot-clip"><rect x="-10" y="0" width="542" height="100" /></clipPath>
          <mask id="boot-mask" maskUnits="userSpaceOnUse" x="-10" y="-10" width="116" height="120">
            <path d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" stroke="#fff" stroke-width="10" />
          </mask>
          <linearGradient id="boot-sea" gradientUnits="userSpaceOnUse" x1="0" y1="-4" x2="0" y2="96">
            <stop offset="0" style="stop-color: var(--water-1, #5eead4)" />
            <stop offset="0.55" style="stop-color: var(--water-2, #38bdf8)" />
            <stop offset="1" style="stop-color: var(--water-3, #60a5fa)" />
          </linearGradient>
        </defs>
        <g clip-path="url(#boot-clip)">
          <path d="M5 0V100M61 0V100M5 50H61" stroke="currentColor" />
          <path transform="translate(104 0)" d="M-1 -6L35 52L71 -6M35 52V100" stroke="currentColor" />
          <path transform="translate(212 0)" d="M5 0V100M5 5H30A39 45 0 0 1 30 95H5" stroke="currentColor" />
          <g transform="translate(324 0)">
            <path class="boot-omega" d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" style="stroke: var(--water-ink, #38bdf8)" opacity="0.3" />
            <g mask="url(#boot-mask)">
              <g class="boot-fill"><g class="boot-ebb"><g class="boot-bob"><g class="boot-swell">
                <path d="M-72 0 q9 -5.5 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 V130 H-72 Z" fill="url(#boot-sea)" stroke="none" />
                <path d="M-72 0 q9 -5.5 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0" stroke="#fff" stroke-width="5" opacity="0.85" />
              </g></g></g></g>
            </g>
          </g>
          <path transform="translate(458 0)" d="M5 100V5H34A25 20 0 0 1 34 50H5M30 50L66 106" stroke="currentColor" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
