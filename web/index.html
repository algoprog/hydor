<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />
    <title>Hydor</title>
    <script src="/theme-boot.js"></script>
    <!--
      While the page loads: the logo, HYDΩR, a stream of bright water running through its Ω (the loader's, CurrentOmega
      in components/Logo.tsx), over the theme's page colour. The moment the app has something of its own to show, it is
      there under the logo, which fades as the stream runs out, its Ω stands whole and the colour around it clears
      (lib/boot.ts). The desktop app shows the same while its server starts (desktop/main.cjs bootPage).
    -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: var(--bg, #000); color: var(--fg, #e9edf5); }
      #boot svg { display: block; width: min(232px, 56vw); height: auto; overflow: visible; }
      /* The stream is a dash on the Ω's path (its length counts as 100): its tail runs along the path while it swells and gathers. */
      #boot .boot-run { stroke-dasharray: 0 200; animation: boot-len 1.7s linear -0.4s infinite, boot-pos 1.7s cubic-bezier(0.4, 0, 0.75, 0.45) -0.4s infinite; }
      #boot .boot-fade { animation: boot-fade 1.7s linear -0.4s infinite; }
      #boot .boot-late, #boot .boot-late .boot-run { animation-delay: -0.3s; }
      @keyframes boot-len { 0% { stroke-dasharray: 0 200; animation-timing-function: ease-out; } 50% { stroke-dasharray: 40 200; animation-timing-function: ease-in; } 100% { stroke-dasharray: 0 200; } }
      @keyframes boot-pos { to { stroke-dashoffset: -100; } }
      @keyframes boot-fade { 0%, 100% { opacity: 0; } 9%, 90% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-current { display: none; }
        #boot .boot-omega { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-label="Hydor is loading">
      <svg viewBox="-4 -1 530 102" width="232" height="45" fill="none" stroke-width="10" aria-hidden="true">
        <defs>
          <clipPath id="boot-clip"><rect x="-10" y="0" width="542" height="100" /></clipPath>
          <mask id="boot-mask" maskUnits="userSpaceOnUse" x="-10" y="-10" width="116" height="120">
            <path d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" stroke="#fff" stroke-width="10" />
          </mask>
          <linearGradient id="boot-sea" gradientUnits="userSpaceOnUse" x1="6" y1="0" x2="90" y2="96">
            <stop offset="0" style="stop-color: var(--water-1, #5eead4)" />
            <stop offset="0.5" style="stop-color: var(--water-2, #38bdf8)" />
            <stop offset="1" style="stop-color: var(--water-3, #60a5fa)" />
          </linearGradient>
          <filter id="boot-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4.4" /></filter>
        </defs>
        <!-- The stream's glow, under the letters and outside their clip, which would cut it at their height. -->
        <g class="boot-current" transform="translate(324 0)">
          <g class="boot-fade"><path class="boot-run" d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" pathLength="100" stroke-linecap="round" stroke="url(#boot-sea)" filter="url(#boot-glow)" opacity="0.75" /></g>
        </g>
        <g clip-path="url(#boot-clip)">
          <path d="M5 0V100M61 0V100M5 50H61" stroke="currentColor" />
          <path transform="translate(104 0)" d="M-1 -6L35 52L71 -6M35 52V100" stroke="currentColor" />
          <path transform="translate(212 0)" d="M5 0V100M5 5H30A39 45 0 0 1 30 95H5" stroke="currentColor" />
          <g transform="translate(324 0)">
            <path class="boot-omega" d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" style="stroke: var(--water-ink, #38bdf8)" opacity="0.3" />
            <g class="boot-current" mask="url(#boot-mask)">
              <g class="boot-fade boot-late"><path class="boot-run" d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" pathLength="100" stroke-linecap="round" stroke="url(#boot-sea)" opacity="0.4" /></g>
              <g class="boot-fade">
                <path class="boot-run" d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" pathLength="100" stroke-linecap="round" stroke="url(#boot-sea)" />
                <path class="boot-run" d="M4 95H24C24 80.6 3 65.3 3 47.3C3 23 23.2 5 48 5C72.8 5 93 23 93 47.3C93 65.3 72 80.6 72 95H92" pathLength="100" stroke-linecap="round" stroke="#fff" stroke-width="2" opacity="0.5" />
              </g>
            </g>
          </g>
          <path transform="translate(458 0)" d="M5 100V5H34A25 20 0 0 1 34 50H5M30 50L66 106" stroke="currentColor" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
